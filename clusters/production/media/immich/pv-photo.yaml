---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: photo
  namespace: media
spec:
  capacity:
    storage: 46Ti
  volumeMode: Filesystem
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs
  mountOptions:
    - nfsvers=4.1
  nfs:
    path: /photos
    server: 10.255.255.79

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pvc-photo
  namespace: media
spec:
  storageClassName: nfs
  accessModes:
    - ReadWriteMany
  volumeName: photo
  resources:
    requests:
      storage: 46Ti

